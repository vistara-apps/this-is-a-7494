name: SolVote CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build frontend
      run: npm run build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: dist/
  
  build-program:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        override: true
        components: rustfmt, clippy
    
    - name: Install Solana
      run: |
        sh -c "$(curl -sSfL https://release.solana.com/v1.14.17/install)"
        export PATH="/home/runner/.local/share/solana/install/active_release/bin:$PATH"
        solana --version
    
    - name: Install Anchor
      run: |
        npm install -g @project-serum/anchor-cli
        anchor --version
    
    - name: Build Anchor program
      run: anchor build --verifiable
    
    - name: Upload program artifacts
      uses: actions/upload-artifact@v4
      with:
        name: program-build
        path: target/deploy/
  
  test:
    runs-on: ubuntu-latest
    needs: [build-frontend, build-program]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run tests
      run: npm test
