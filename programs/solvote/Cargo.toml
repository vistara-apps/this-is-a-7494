[package]
name = "solvote"
version = "0.1.0"
description = "Effortless On-Chain Voting for Your Solana Community"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solvote"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.26.0"
solana-program = "1.14.17"

